<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:440px;height:auto" role="img" aria-labelledby="P23-2-8-linear-form-t P23-2-8-linear-form-d">
<title id="P23-2-8-linear-form-t">A straight-line graph of lg y against x through (0, 2) and (4, 4)</title>
<desc id="P23-2-8-linear-form-d">If y equals A times 10 to the power p x, then lg y equals lg A plus p x. The intercept 2 means A is 100, and the gradient is 0.5, so p is 0.5.</desc>
<rect x="0" y="0" width="440" height="290" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="13" fill="#333">
  <line x1="50" y1="240" x2="400" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="260" x2="70" y2="30" stroke="#333" stroke-width="1.5"/>
  <polygon points="400,240 390,236 390,244" fill="#333"/>
  <polygon points="70,30 66,40 74,40" fill="#333"/>
  <text x="388" y="258">x</text>
  <text x="78" y="28">lg y</text>
  <text x="56" y="256">O</text>
  <line x1="70" y1="160" x2="310" y2="80" stroke="#1b5e8a" stroke-width="2.2"/>
  <circle cx="70" cy="160" r="3.3" fill="#1b5e8a"/>
  <circle cx="310" cy="80" r="3.3" fill="#1b5e8a"/>
  <text x="78" y="152">(0, 2)</text>
  <text x="318" y="72">(4, 4)</text>
</g>
</svg>
