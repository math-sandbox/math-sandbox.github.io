<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-labelledby="s121-t s121-d">
<title id="s121-t">Histogram of 104 lengths with the tallest column on the narrowest class</title>
<desc id="s121-d">A histogram with no gaps. The first column, from 0 to 10, has frequency density 4. The second column, from 10 to 16, has frequency density 6. The third column, from 16 to 20, has frequency density 7 and is the tallest, so it is the modal class, even though it has the smallest frequency.</desc>
