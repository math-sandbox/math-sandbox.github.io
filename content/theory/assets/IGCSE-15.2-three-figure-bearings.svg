<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:440px;height:auto" role="img" aria-labelledby="IGCSE-15-2-three-figure-bearings-t IGCSE-15-2-three-figure-bearings-d">
<title id="IGCSE-15-2-three-figure-bearings-t">Three-figure bearings measured clockwise from north</title>
<desc id="IGCSE-15-2-three-figure-bearings-d">From O, the bearing of P is 070 degrees and the bearing of R is 315 degrees. Both angles are measured clockwise from north.</desc>
<rect x="0" y="0" width="440" height="300" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="13" fill="#333">
  <line x1="120.00" y1="170.00" x2="120.00" y2="80.00" stroke="#333" stroke-width="1.6"/>
  <polygon points="120.00,80.00 115.00,92.00 125.00,92.00" fill="#333"/>
  <text x="128.00" y="84.00" font-size="12">North</text>
  <circle cx="120.00" cy="170.00" r="3.5" fill="#333"/>
  <text x="108.00" y="186.00" font-size="14">O</text>
  <line x1="120.00" y1="170.00" x2="213.97" y2="135.80" stroke="#1b5e8a" stroke-width="2"/>
  <circle cx="213.97" cy="135.80" r="3.5" fill="#1b5e8a"/>
  <text x="221.97" y="139.80" fill="#1b5e8a">P</text>
  <path d="M 120,134 A 36,36 0 0 1 153.83,157.69" fill="none" stroke="#1e7a46" stroke-width="1.6"/>
  <text x="142.00" y="148.00" fill="#1e7a46" font-size="13">070°</text>
  <line x1="320.00" y1="170.00" x2="320.00" y2="80.00" stroke="#333" stroke-width="1.6"/>
  <polygon points="320.00,80.00 315.00,92.00 325.00,92.00" fill="#333"/>
  <text x="328.00" y="84.00" font-size="12">North</text>
  <circle cx="320.00" cy="170.00" r="3.5" fill="#333"/>
  <text x="308.00" y="186.00" font-size="14">O</text>
  <line x1="320.00" y1="170.00" x2="249.29" y2="99.29" stroke="#c0392b" stroke-width="2"/>
  <circle cx="249.29" cy="99.29" r="3.5" fill="#c0392b"/>
  <text x="231.29" y="103.29" text-anchor="end" fill="#c0392b">R</text>
  <path d="M 320,138 A 32,32 0 1 1 297.37,147.37" fill="none" stroke="#b45f06" stroke-width="1.6"/>
  <text x="340.00" y="206.00" fill="#b45f06" font-size="13">315°</text>
  <text x="220.00" y="28.00" text-anchor="middle" font-size="13">Bearings are measured clockwise from north</text>
</g>
</svg>
