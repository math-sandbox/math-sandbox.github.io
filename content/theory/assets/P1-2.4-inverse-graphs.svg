<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:440px;height:auto" role="img" aria-labelledby="P1-2-4-inverse-graphs-t P1-2-4-inverse-graphs-d">
<title id="P1-2-4-inverse-graphs-t">A linear function and its inverse reflected in y = x</title>
<desc id="P1-2-4-inverse-graphs-d">The graph of y equals 3x minus 1 for x from minus 2 to 3, and the graph of the inverse y equals (x plus 1) over 3, are reflections of one another in the line y equals x. The point (3, 8) is paired with (8, 3).</desc>
<rect x="0" y="0" width="440" height="320" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="13" fill="#333">
  <line x1="50.00" y1="173.56" x2="410.00" y2="173.56" stroke="#333" stroke-width="1.6"/>
  <line x1="210.00" y1="290.00" x2="210.00" y2="28.00" stroke="#333" stroke-width="1.6"/>
  <polygon points="410.00,173.56 400.00,169.56 400.00,177.56" fill="#333"/>
  <polygon points="210.00,28.00 206.00,38.00 214.00,38.00" fill="#333"/>
  <text x="398.00" y="191.56" >x</text>
  <text x="220.00" y="32.00" >y</text>
  <line x1="50.00" y1="290.00" x2="410.00" y2="28.00" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="382.00" y="38.38" fill="#666" font-size="12">y = x</text>
  <line x1="170.00" y1="275.44" x2="270.00" y2="57.11" stroke="#1b5e8a" stroke-width="2.3"/>
  <text x="278.00" y="61.11" fill="#1b5e8a" font-size="12">y = 3x − 1</text>
  <line x1="70.00" y1="202.67" x2="370.00" y2="129.89" stroke="#c0392b" stroke-width="2.3"/>
  <text x="366.00" y="147.89" text-anchor="end" fill="#c0392b" font-size="12">y = (x + 1)/3</text>
  <circle cx="270.00" cy="57.11" r="3.6" fill="#1b5e8a"/>
  <circle cx="370.00" cy="129.89" r="3.6" fill="#c0392b"/>
  <line x1="270.00" y1="57.11" x2="370.00" y2="129.89" stroke="#7a4a16" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="276.00" y="49.11" fill="#1b5e8a" font-size="12">(3, 8)</text>
  <text x="376.00" y="143.89" fill="#c0392b" font-size="12">(8, 3)</text>
</g>
</svg>
