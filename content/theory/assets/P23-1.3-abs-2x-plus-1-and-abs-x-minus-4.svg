<svg preserveAspectRatio="xMidYMid meet" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" width="100%" style="max-width:100%;height:auto" role="img" aria-labelledby="p23b-t p23b-d"><title id="p23b-t">The graphs of y equals the modulus of 2x plus 1 and y equals the modulus of x minus 4</title><desc id="p23b-d">The V-shaped graph y = |2x plus 1| has its vertex at (minus 1/2, 0). The V-shaped graph y = |x minus 4| has its vertex at (4, 0). The graphs meet at x = minus 5 and at x = 1. The inequality |2x plus 1| is at least |x minus 4| holds for x at most minus 5 or x at least 1.</desc><line x1="-16" y1="240" x2="392" y2="240" stroke="#333" stroke-width="1.2"/><line x1="200" y1="16" x2="200" y2="264.0" stroke="#333" stroke-width="1.2"/><polygon points="392,240 380,235 380,245" fill="#333"/><polygon points="200,16 195,28 205,28" fill="#333"/><text x="386" y="258" font-family="serif" font-size="14" fill="#111">x</text><text x="208" y="20" font-family="serif" font-size="14" fill="#111">y</text><text x="186" y="256" font-family="serif" font-size="12" fill="#111">O</text><line x1="8" y1="236" x2="8" y2="244" stroke="#333" stroke-width="1"/><text x="8" y="256" text-anchor="middle" font-family="serif" font-size="11" fill="#111">-8</text><line x1="32" y1="236" x2="32" y2="244" stroke="#333" stroke-width="1"/><line x1="56" y1="236" x2="56" y2="244" stroke="#333" stroke-width="1"/><text x="56" y="256" text-anchor="middle" font-family="serif" font-size="11" fill="#111">-6</text><line x1="80" y1="236" x2="80" y2="244" stroke="#333" stroke-width="1"/><line x1="104" y1="236" x2="104" y2="244" stroke="#333" stroke-width="1"/><text x="104" y="256" text-anchor="middle" font-family="serif" font-size="11" fill="#111">-4</text><line x1="128" y1="236" x2="128" y2="244" stroke="#333" stroke-width="1"/><line x1="152" y1="236" x2="152" y2="244" stroke="#333" stroke-width="1"/><text x="152" y="256" text-anchor="middle" font-family="serif" font-size="11" fill="#111">-2</text