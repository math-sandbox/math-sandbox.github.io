<svg preserveAspectRatio="xMidYMid meet" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 340" width="100%" style="max-width:100%;height:auto" role="img" aria-labelledby="s212-t s212-d"><title id="s212-t">Binomial distribution B(10, 0.4) with a two-tailed 5 percent critical region</title><desc id="s212-d">A bar chart of the binomial probabilities for X from 0 to 10. The bars at 0 and at 8, 9 and 10 are shaded to mark the two tails of a 5 percent two-tailed test, with 2.5 percent in each tail. The acceptance region lies between the dashed lines.</desc><line x1="40" y1="280" x2="414" y2="280" stroke="#333" stroke-width="1.2"/><line x1="46" y1="40.0" x2="46" y2="280" stroke="#333" stroke-width="1.2"/><polygon points="414,280 402,275 402,285" fill="#333"/><polygon points="46,40.0 41,52.0 51,52.0" fill="#333"/><text x="406" y="296" font-family="serif" font-size="14" fill="#111">x</text><text x="46" y="32.0" text-anchor="middle" font-family="serif" font-size="14" fill="#111">P(X = x)</text><text x="224.0" y="314" text-anchor="middle" font-family="serif" font-size="13" fill="#111">X ~ B(10, 0.4)</text><rect x="50.0" y="274.7" width="28" height="5.3" fill="#c0392b" stroke="#922b21" stroke-width="1.2"/><text x="64.0" y="296" text-anchor="middle" font-family="serif" font-size="12" fill="#111">0</text><rect x="82.0" y="244.6" width="28" height="35.4" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/><text x="96.0" y="296" text-anchor="middle" font-family="serif" font-size="12" fill="#111">1</text><rect x="114.0" y="173.9" width="28" height="106.1" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/><text x="128.0" y="296" text-anchor="middle" font-family="serif" font-size="12" fill="#111">2</text><rect x="146.0" y="91.4" width="28" height="188.6" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/><text x="160.0" y="296" text-anchor="middle" font-family="serif" font-size="12" fill="#111">3</text><rect x="178.0" y="60.0" width="28" height="220.0" fill="#aed6f