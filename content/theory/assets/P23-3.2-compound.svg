<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:400px;height:auto" role="img" aria-label="Two adjacent angles A and B making a compound angle A plus B">
  <style>text{font-family:system-ui,Segoe UI,sans-serif;font-size:13px;fill:#222}</style>
  <line x1="40" y1="210" x2="370" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="210" x2="240" y2="50" stroke="#1d4f91" stroke-width="2"/>
  <line x1="80" y1="210" x2="340" y2="130" stroke="#b42318" stroke-width="2"/>
  <text x="120" y="200">A</text>
  <text x="200" y="200">B</text>
  <text x="250" y="90">A + B</text>
</svg>
