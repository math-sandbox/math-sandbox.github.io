<svg viewBox="0 0 376 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ig214b-t ig214b-d" style="width:100%;max-width:376px;height:auto"><title id="ig214b-t">Speed-time graph of a car that accelerates from rest and then travels at constant speed</title><desc id="ig214b-d">Speed in metres per second against time in seconds, not to scale. The speed rises in a straight line from 0 at time 0 to V at time 4, then stays at V until time 14. Dashed lines mark time 4, time 14 and speed V.</desc><line x1="126.8" y1="204.0" x2="126.8" y2="49.3" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><line x1="282.2" y1="204.0" x2="282.2" y2="49.3" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><line x1="78.0" y1="49.3" x2="126.8" y2="49.3" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><path d="M 78.0 204.0 L 126.8 49.3 L 282.2 49.3" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><line x1="78.0" y1="204.0" x2="322.0" y2="204.0" stroke="#1a1a1a" stroke-width="1.3"/><path d="M 330.0 204.0 L 320.0 200.0 L 320.0 208.0 Z" fill="#1a1a1a"/><line x1="78.0" y1="204.0" x2="78.0" y2="16.0" stroke="#1a1a1a" stroke-width="1.3"/><path d="M 78.0 8.0 L 74.0 18.0 L 82.0 18.0 Z" fill="#1a1a1a"/><line x1="78.0" y1="204.0" x2="78.0" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="78.0" y="220.0" font-size="12" font-family="serif" text-anchor="middle">0</text><line x1="126.8" y1="204.0" x2="126.8" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="126.8" y="220.0" font-size="12" font-family="serif" text-anchor="middle">4</text><line x1="282.2" y1="204.0" x2="282.2" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="282.2" y="220.0" font-size="12" font-family="serif" text-anchor="middle">14</text><line x1="74.0" y1="204.0" x2="78.0" y2="204.0" stroke="#1a1a1a" stroke-width="1"/><text x="71.0" y="208.0" font-size="12" font-family="serif" text-anchor="end">0</text><line x1="74.0" y1="49.3" x2="78.0" y2="49.3" stroke="#1a1a1a" stroke-width="1