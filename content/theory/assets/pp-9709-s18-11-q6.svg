<svg preserveAspectRatio="xMidYMid meet" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%" style="max-width:100%;height:auto" role="img" aria-labelledby="t d">
<title id="t">Circle with tangent AT and line OBT, showing a shaded region</title>
<desc id="d">Circle centre O radius r centimetres. Point A is at the top of the circle and AT is a horizontal tangent meeting the line through O and B at T. Angle AOB is marked theta radians. The shaded region is bounded by the tangent AT, the line TB and the minor arc AB.</desc>
