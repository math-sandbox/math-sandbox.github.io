<path d="M 170.00,120.00 L 346.83,120.00 L 250.21,169.18 A 90 90 0 0 1 170.00,120.00 Z" fill="#c5c5c5" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<line x1="170" y1="210" x2="346.83" y2="120.00" stroke="#111" stroke-width="2"/>
<line x1="170" y1="210" x2="170.00" y2="120.00" stroke="#111" stroke-width="2"/>
<circle cx="170" cy="210" r="2.5" fill="#111"/>
<path d="M 170.00,188.00 A 22 22 0 0 1 189.61,200.02" fill="none" stroke="#111" stroke-width="1.4"/>
