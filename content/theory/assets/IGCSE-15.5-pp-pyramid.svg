<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:440px;height:auto" role="img" aria-labelledby="IGCSE-15-5-pp-pyramid-t IGCSE-15-5-pp-pyramid-d">
<title id="IGCSE-15-5-pp-pyramid-t">Square-based pyramid with height 5 centimetres and base diagonal 8 centimetres</title>
<desc id="IGCSE-15-5-pp-pyramid-d">Square base ABCD with diagonal DB equal to 8 centimetres, so XB is 4 centimetres. P is vertically above the centre X with PX equal to 5 centimetres. The angle between PB and the base is angle PBX, and tan of that angle is 5 over 4.</desc>
<rect x="0" y="0" width="440" height="280" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="13" fill="#333">
  <!-- base square in perspective -->
  <polygon points="80,200 220,230 360,200 220,170" fill="#f4efe6" stroke="#333" stroke-width="1.6"/>
  <text x="70" y="208">A</text>
  <text x="214" y="248">B</text>
  <text x="366" y="204">C</text>
  <text x="214" y="164">D</text>
  <circle cx="220" cy="200" r="3" fill="#1b5e8a"/>
  <text x="228" y="198" fill="#1b5e8a">X</text>
  <!-- vertical -->
  <line x1="220" y1="200" x2="220" y2="80" stroke="#1e7a46" stroke-width="1.8"/>
  <circle cx="220" cy="80" r="3.2" fill="#c0392b"/>
  <text x="230" y="78" fill="#c0392b">P</text>
  <text x="226" y="145" fill="#1e7a46">5 cm</text>
  <!-- diagonal DB -->
  <line x1="214" y1="248" x2="220" y2="170" stroke="#b35c1e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="250" y="220" fill="#b35c1e">DB = 8 cm</text>
  <!-- PB -->
  <line x1="220" y1="80" x2="220" y2="230" stroke="#c0392b" stroke-width="1.8"/>
  <!-- XB half diagonal on base -->
  <line x1="220" y1="200" x2="220" y2="230" stroke="#1b5e8a" stroke-width="1.6"/>
  <text x="188" y="222" fill="#1b5e8a">4 cm</text>
  <!-- right angle at X in triangle PXB, vertical to base -->
  <rect x="220" y="200" width="10" height="10" fill="none" stroke="#1e7a46" stroke-width="1.2" transform="translate(0,0)"/>
</g>
</svg>
