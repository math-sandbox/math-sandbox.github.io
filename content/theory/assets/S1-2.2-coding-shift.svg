<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-labelledby="s122b-t s122b-d">
<title id="s122b-t">Coding by subtracting a constant shifts the mean by the same amount</title>
<desc id="s122b-d">A number line of values of x with mean 23, and a parallel line of coded values x minus 20 with mean 3. The whole set, including the mean, is translated by minus 20.</desc>
<text x="50" y="36" font-family="serif" font-size="13" fill="#1d4ed8">values of x</text>
<line x1="50" y1="70" x2="390" y2="70" stroke="#333" stroke-width="1.2"/>
<line x1="86.0" y1="70" x2="86.0" y2="78" stroke="#333" stroke-width="1"/>
<text x="86.0" y="94" text-anchor="middle" font-family="serif" font-size="12" fill="#111">3</text>
<line x1="290.0" y1="70" x2="290.0" y2="78" stroke="#333" stroke-width="1"/>
<text x="290.0" y="94" text-anchor="middle" font-family="serif" font-size="12" fill="#111">20</text>
<line x1="326.0" y1="70" x2="326.0" y2="78" stroke="#333" stroke-width="1"/>
<text x="326.0" y="94" text-anchor="middle" font-family="serif" font-size="12" fill="#111">23</text>
<line x1="386.0" y1="70" x2="386.0" y2="78" stroke="#333" stroke-width="1"/>
<text x="386.0" y="94" text-anchor="middle" font-family="serif" font-size="12" fill="#111">28</text>
<circle cx="326.0" cy="70" r="6" fill="#2563eb"/>
<text x="326.0" y="54" text-anchor="middle" font-family="serif" font-size="12" fill="#1d4ed8">mean 23</text>
<text x="50" y="118" font-family="serif" font-size="13" fill="#b91c1c">coded values x − 20</text>
<line x1="50" y1="150" x2="390" y2="150" stroke="#333" stroke-width="1.2"/>
<line x1="86.0" y1="150" x2="86.0" y2="158" stroke="#333" stroke-width="1"/>
<text x="86.0" y="174" text-anchor="middle" font-family="serif" font-size="12" fill="#111">3</text>
<line x1="146.0" y1="150" x2="146.0" y2="158" stroke="#333" stroke-width="1"/>
<text x="146.0" y="174" text-anchor="middle" font-family="serif" font-size="12" fill="#111">8</text>
<circle cx="86.0" cy="150" r="6" fill="#b91c1c"/>
<text x="122.0" y="138" text-anchor="start" font-family="serif" font-size="12" fill="#991b1b">mean 3</text>
<line x1="326.0" y1="76" x2="86.0" y2="144" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
<text x="210" y="118" font-family="serif" font-size="12" fill="#15803d">translate by −20</text>
</svg>
