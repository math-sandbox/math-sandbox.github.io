<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:440px;height:auto" role="img" aria-labelledby="S1-2-3-ordered-list-t S1-2-3-ordered-list-d">
<title id="S1-2-3-ordered-list-t">The median of seven ordered values is the fourth value, 8</title>
<desc id="S1-2-3-ordered-list-d">The ordered list 3, 5, 6, 8, 11, 12, 15 has seven values, so the median is the 4th value, 8.</desc>
<rect x="0" y="0" width="440" height="240" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" fill="#333">
  <rect x="40" y="110" width="46" height="46" rx="4" fill="#eef5fb" stroke="#1b5e8a" stroke-width="1.8"/><text x="63" y="140" text-anchor="middle" font-size="16">3</text><text x="63" y="176" text-anchor="middle" font-size="11" fill="#666">#1</text><rect x="94" y="110" width="46" height="46" rx="4" fill="#eef5fb" stroke="#1b5e8a" stroke-width="1.8"/><text x="117" y="140" text-anchor="middle" font-size="16">5</text><text x="117" y="176" text-anchor="middle" font-size="11" fill="#666">#2</text><rect x="148" y="110" width="46" height="46" rx="4" fill="#eef5fb" stroke="#1b5e8a" stroke-width="1.8"/><text x="171" y="140" text-anchor="middle" font-size="16">6</text><text x="171" y="176" text-anchor="middle" font-size="11" fill="#666">#3</text><rect x="202" y="110" width="46" height="46" rx="4" fill="#f8e6a0" stroke="#b35c1e" stroke-width="1.8"/><text x="225" y="140" text-anchor="middle" font-size="16">8</text><text x="225" y="176" text-anchor="middle" font-size="11" fill="#666">#4</text><rect x="256" y="110" width="46" height="46" rx="4" fill="#eef5fb" stroke="#1b5e8a" stroke-width="1.8"/><text x="279" y="140" text-anchor="middle" font-size="16">11</text><text x="279" y="176" text-anchor="middle" font-size="11" fill="#666">#5</text><rect x="310" y="110" width="46" height="46" rx="4" fill="#eef5fb" stroke="#1b5e8a" stroke-width="1.8"/><text x="333" y="140" text-anchor="middle" font-size="16">12</text><text x="333" y="176" text-anchor="middle" font-size="11" fill="#666">#6</text><rect x="364" y="110" width="46" height="46" rx="4" fill="#eef5fb" stroke="#1b5e8a" stroke-width="1.8"/><text x="387" y="140" text-anchor="middle" font-size="16">15</text><text x="387" y="176" text-anchor="middle" font-size="11" fill="#666">#7</text>
  <text x="220" y="70" text-anchor="middle" font-size="14">The middle value of 7 ordered observations is the 4th, which is 8.</text>
  <text x="229" y="210" text-anchor="middle" font-size="13" fill="#b35c1e">median = 8</text>
</g>
</svg>
