<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:400px;height:auto" role="img" aria-labelledby="IGCSE-15-6-related-angle-t IGCSE-15-6-related-angle-d">
<title id="IGCSE-15-6-related-angle-t">The angles 30 degrees and 150 degrees have the same sine</title>
<desc id="IGCSE-15-6-related-angle-d">The dashed vertical heights from the unit-circle points at 30 degrees and 150 degrees are equal, so sin 150 degrees equals sin 30 degrees, which is 1/2.</desc>
<rect x="0" y="0" width="400" height="340" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="14" fill="#333">
  <line x1="60" y1="180" x2="360" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="320" x2="200" y2="30" stroke="#333" stroke-width="1.5"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="#1b5e8a" stroke-width="2"/>
  <line x1="200" y1="180" x2="303.92" y2="120.00" stroke="#1e7a46" stroke-width="2"/>
  <line x1="200" y1="180" x2="96.08" y2="120.00" stroke="#c0392b" stroke-width="2"/>
  <line x1="303.92" y1="120.00" x2="303.92" y2="180" stroke="#1e7a46" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="96.08" y1="120.00" x2="96.08" y2="180" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="309.92" y="114.00" fill="#1e7a46">30&#176;</text>
  <text x="46.08" y="114.00" fill="#c0392b">150&#176;</text>
  <text x="208" y="48">y</text>
  <text x="336" y="172">x</text>
</g>
</svg>
