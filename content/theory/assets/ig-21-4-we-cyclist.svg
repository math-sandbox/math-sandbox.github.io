<svg viewBox="0 0 376 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ig214w-t ig214w-d" style="width:100%;max-width:376px;height:auto"><title id="ig214w-t">Speed-time graph of a cyclist</title><desc id="ig214w-d">Speed in metres per second against time in seconds, not to scale. The speed rises in a straight line from 0 at time 0 to 8 at time 20, stays at 8 until time 60, then falls in a straight line to 0 at time 80. Dashed lines mark times 20 and 60 and speed 8.</desc><line x1="133.5" y1="204.0" x2="133.5" y2="58.4" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><line x1="237.8" y1="204.0" x2="237.8" y2="58.4" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><line x1="78.0" y1="58.4" x2="133.5" y2="58.4" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/><path d="M 78.0 204.0 L 133.5 58.4 L 237.8 58.4 L 293.3 204.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><line x1="78.0" y1="204.0" x2="322.0" y2="204.0" stroke="#1a1a1a" stroke-width="1.3"/><path d="M 330.0 204.0 L 320.0 200.0 L 320.0 208.0 Z" fill="#1a1a1a"/><line x1="78.0" y1="204.0" x2="78.0" y2="16.0" stroke="#1a1a1a" stroke-width="1.3"/><path d="M 78.0 8.0 L 74.0 18.0 L 82.0 18.0 Z" fill="#1a1a1a"/><line x1="78.0" y1="204.0" x2="78.0" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="78.0" y="220.0" font-size="12" font-family="serif" text-anchor="middle">0</text><line x1="133.5" y1="204.0" x2="133.5" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="133.5" y="220.0" font-size="12" font-family="serif" text-anchor="middle">20</text><line x1="237.8" y1="204.0" x2="237.8" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="237.8" y="220.0" font-size="12" font-family="serif" text-anchor="middle">60</text><line x1="293.3" y1="204.0" x2="293.3" y2="208.0" stroke="#1a1a1a" stroke-width="1"/><text x="293.3" y="220.0" font-size="12" font-family="serif" text-anchor="middle">80</text><line x1="74.0" y1="204.0" x2="78.0" y2="204.0" stroke="#1a1a1a" stroke