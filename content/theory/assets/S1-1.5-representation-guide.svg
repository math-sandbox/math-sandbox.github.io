<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="auto" role="img" aria-label="Guide to choosing a data representation.">
  <style>
    .box { fill:#e8f0f7; stroke:#2c4a6e; stroke-width:1.2; }
    .leaf { fill:#dceee0; stroke:#2c4a6e; stroke-width:1.2; }
    .t { font-family: "DejaVu Sans", sans-serif; font-size:13px; fill:#1a1a1a; }
    .s { font-family: "DejaVu Sans", sans-serif; font-size:12px; fill:#1a1a1a; }
  </style>
  <rect x="8" y="8" width="200" height="44" rx="6" class="box"/>
  <text x="108" y="35" text-anchor="middle" class="t">Qualitative data</text>
  <rect x="8" y="72" width="200" height="56" rx="6" class="box"/>
  <text x="108" y="94" text-anchor="middle" class="t">Ungrouped</text>
  <text x="108" y="112" text-anchor="middle" class="t">quantitative data</text>
  <rect x="8" y="148" width="200" height="56" rx="6" class="box"/>
  <text x="108" y="170" text-anchor="middle" class="t">Small amount of</text>
  <text x="108" y="188" text-anchor="middle" class="t">discrete data</text>
  <rect x="8" y="224" width="200" height="72" rx="6" class="box"/>
  <text x="108" y="250" text-anchor="middle" class="t">Large amount of discrete</text>
  <text x="108" y="268" text-anchor="middle" class="t">data, or continuous data</text>

  <line x1="208" y1="30" x2="300" y2="30" stroke="#2c4a6e" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="208" y1="100" x2="300" y2="100" stroke="#2c4a6e" stroke-width="1.2"/>
  <line x1="208" y1="176" x2="300" y2="176" stroke="#2c4a6e" stroke-width="1.2"/>
  <line x1="208" y1="260" x2="300" y2="260" stroke="#2c4a6e" stroke-width="1.2"/>

  <rect x="300" y="8" width="400" height="56" rx="6" class="leaf"/>
  <text x="500" y="30" text-anchor="middle" class="s">Pictogram, vertical line graph,</text>
  <text x="500" y="48" text-anchor="middle" class="s">bar chart or pie chart</text>
  <rect x="300" y="148" width="400" height="56" rx="6" class="leaf"/>
  <text x="500" y="182" text-anchor="middle" class="s">Stem-and-leaf diagram</text>
  <rect x="300" y="224" width="400" height="72" rx="6" class="leaf"/>
  <text x="500" y="254" text-anchor="middle" class="s">Histogram or</text>
  <text x="500" y="274" text-anchor="middle" class="s">cumulative frequency graph</text>
  <!-- merge first two arrows into same leaf -->
  <line x1="208" y1="100" x2="250" y2="100" stroke="#2c4a6e" stroke-width="1.2"/>
  <line x1="250" y1="30" x2="250" y2="100" stroke="#2c4a6e" stroke-width="1.2"/>
  <line x1="250" y1="30" x2="300" y2="30" stroke="#2c4a6e" stroke-width="1.2"/>
</svg>
