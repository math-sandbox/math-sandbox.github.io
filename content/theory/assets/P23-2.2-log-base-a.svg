<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-labelledby="p222-t p222-d">
<title id="p222-t">Graphs of y equals a to the x and y equals log base a of x, reflections in y equals x</title>
<desc id="p222-d">Two curves, reflections of each other in the line y equals x. The increasing curve y equals a to the x passes through (0, 1). The increasing curve y equals log base a of x passes through (1, 0).</desc>
<line x1="40" y1="250" x2="390" y2="250" stroke="#333" stroke-width="1.2"/>
<line x1="80" y1="20" x2="80" y2="270" stroke="#333" stroke-width="1.2"/>
<polygon points="390,250 378,245 378,255" fill="#333"/>
<polygon points="80,20 75,32 85,32" fill="#333"/>
<line x1="40" y1="290" x2="360" y2="-30" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M80 250 C 100 180, 130 110, 160 70 C 200 30, 250 18, 310 14" fill="none" stroke="#1a5276" stroke-width="2"/>
<path d="M80 250 C 150 230, 220 200, 260 160 C 310 110, 350 60, 370 30" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="80" cy="250" r="3" fill="#1a5276"/>
<circle cx="200" cy="250" r="3" fill="#c0392b"/>
<text x="92" y="244" font-family="serif" font-size="12" fill="#1a5276">(0, 1)</text>
<text x="208" y="266" font-family="serif" font-size="12" fill="#c0392b">(1, 0)</text>
<text x="300" y="40" font-family="serif" font-size="14" fill="#1a5276">y = a^x</text>
<text x="300" y="90" font-family="serif" font-size="14" fill="#c0392b">y = log_a x</text>
<text x="378" y="268" font-family="serif" font-size="14" fill="#111">x</text>
<text x="88" y="18" font-family="serif" font-size="14" fill="#111">y</text>
</svg>
