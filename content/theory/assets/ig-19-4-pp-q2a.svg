<svg viewBox="0 0 368 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ig194a-t ig194a-d" style="width:100%;max-width:368px;height:auto"><title id="ig194a-t">Circle, centre O, with points A, B and P on the circumference and angle OBA equal to 38 degrees</title><desc id="ig194a-d">Circle centre O. Radii OA and OB, chord AB, and point P on the circumference so that AP and BP are drawn. Angle OBA is marked 38 degrees. A NOT TO SCALE label sits inside the picture, away from the edges.</desc><circle cx="180.0" cy="125.0" r="88.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><line x1="180.0" y1="125.0" x2="172.3" y2="37.3" stroke="#1a1a1a" stroke-width="1.6"/><line x1="180.0" y1="125.0" x2="97.3" y2="155.1" stroke="#1a1a1a" stroke-width="1.6"/><line x1="172.3" y1="37.3" x2="97.3" y2="155.1" stroke="#1a1a1a" stroke-width="1.6"/><line x1="172.3" y1="37.3" x2="230.5" y2="197.1" stroke="#0b5cab" stroke-width="1.5"/><line x1="97.3" y1="155.1" x2="230.5" y2="197.1" stroke="#0b5cab" stroke-width="1.5"/><circle cx="180.0" cy="125.0" r="3" fill="#1a1a1a"/><text x="190.0" y="129.0" font-size="13" font-family="sans-serif">O</text><text x="164.3" y="29.3" font-size="13" font-family="sans-serif">A</text><text x="81.3" y="161.1" font-size="13" font-family="sans-serif">B</text><text x="238.5" y="213.1" font-size="13" font-family="sans-serif">P</text><text x="119.3" y="145.1" font-size="12" font-family="sans-serif">38°</text><text y="28.0" font-size="11" font-family="sans-serif" x="360" text-anchor="end">NOT TO SCALE</text></svg>