<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-label="A box marking Q1, Q2 and Q3, used to show the interquartile range of a data set">
  <style>text{font-family:system-ui,Segoe UI,sans-serif;font-size:13px;fill:#222}</style>
  <line x1="30" y1="90" x2="390" y2="90" stroke="#333" stroke-width="2"/>
  <rect x="120" y="60" width="180" height="60" fill="#e8f0fe" stroke="#1d4f91" stroke-width="2"/>
  <line x1="210" y1="60" x2="210" y2="120" stroke="#1d4f91" stroke-width="2"/>
  <line x1="120" y1="50" x2="120" y2="130" stroke="#1d4f91" stroke-width="1.5"/>
  <line x1="300" y1="50" x2="300" y2="130" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="100" y="150">Q1</text>
  <text x="200" y="46">Q2</text>
  <text x="288" y="150">Q3</text>
  <text x="110" y="30">interquartile range of a data set</text>
</svg>
