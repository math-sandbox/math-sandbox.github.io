<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:400px;height:auto" role="img" aria-labelledby="IGCSE-15-6-cast-t IGCSE-15-6-cast-d">
<title id="IGCSE-15-6-cast-t">Sign of sine, cosine and tangent in each quadrant from 0 to 360 degrees</title>
<desc id="IGCSE-15-6-cast-d">In the first quadrant all three ratios are positive. Sine is also positive in the second quadrant, tangent in the third, and cosine in the fourth.</desc>
<rect x="0" y="0" width="400" height="320" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="14" fill="#333">
  <line x1="60" y1="160" x2="350" y2="160" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="295" x2="200" y2="20" stroke="#333" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="110" fill="none" stroke="#1b5e8a" stroke-width="2"/>
  <text x="330" y="152">x</text>
  <text x="208" y="34">y</text>
  <text x="240" y="120" fill="#1e7a46" font-size="16">All +</text>
  <text x="100" y="120" fill="#1b5e8a" font-size="16">Sin +</text>
  <text x="100" y="215" fill="#b35c1e" font-size="16">Tan +</text>
  <text x="240" y="215" fill="#c0392b" font-size="16">Cos +</text>
  <text x="208" y="290" font-size="12">0&#176; / 360&#176;</text>
  <text x="172" y="42" font-size="12">90&#176;</text>
  <text x="52" y="152" font-size="12">180&#176;</text>
  <text x="180" y="290" font-size="12">270&#176;</text>
</g>
</svg>
