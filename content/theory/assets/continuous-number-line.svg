<svg preserveAspectRatio="xMidYMid meet" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" style="max-width:100%;height:auto" role="img" aria-labelledby="cont-nl-t cont-nl-d"><title id="cont-nl-t">A continuous interval on a number line</title><desc id="cont-nl-d">A number line with a shaded interval from a to b, showing that continuous data can take any value in a range.</desc><line x1="20" y1="40" x2="320" y2="40" stroke="#333" stroke-width="1.4"/><polygon points="320,40 310,35 310,45" fill="#333"/><line x1="100" y1="40" x2="280" y2="40" stroke="#1a5276" stroke-width="8" stroke-linecap="butt"/><circle cx="100" cy="40" r="5" fill="#1a5276"/><circle cx="280" cy="40" r="5" fill="#1a5276"/><text x="100" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">a</text><text x="280" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">b</text></svg>
