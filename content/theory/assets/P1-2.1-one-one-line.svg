<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-labelledby="p121a-t p121a-d">
<title id="p121a-t">One-one function y equals x plus 2</title>
<desc id="p121a-d">A straight line of gradient 1 and intercept 2. A dashed path shows that the input 2 is mapped to the unique output 4.</desc>

<rect x="0" y="0" width="420" height="280" fill="#fff"/>
<g font-family="Source Sans 3, DejaVu Sans, sans-serif" font-size="13" fill="#333">
  <line x1="40" y1="230" x2="390" y2="230" stroke="#333" stroke-width="1.6"/>
  <line x1="160" y1="260" x2="160" y2="20" stroke="#333" stroke-width="1.6"/>
  <polygon points="390,230 380,226 380,234" fill="#333"/>
  <polygon points="160,20 156,30 164,30" fill="#333"/>
  <text x="382" y="248">x</text>
  <text x="172" y="32">f(x)</text>
  <line x1="80" y1="250" x2="340" y2="70" stroke="#1b5e8a" stroke-width="2.4"/>
  <text x="300" y="78" fill="#1b5e8a">y = x + 2</text>
  <!-- x=2 maps uniquely to 4 -->
  <line x1="232" y1="230" x2="232" y2="146" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="232" y1="146" x2="160" y2="146" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="160,146 170,142 170,150" fill="#c0392b"/>
  <circle cx="232" cy="230" r="3.2" fill="#c0392b"/>
  <circle cx="232" cy="146" r="3.2" fill="#1b5e8a"/>
  <text x="238" y="248" font-size="12">2</text>
  <text x="148" y="142" text-anchor="end" font-size="12">4</text>
</g>

</svg>
