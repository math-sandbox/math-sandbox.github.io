<desc id="IGCSE-15-3-pp-0580-43-ON19-Q4a-post-d">B and C lie on horizontal ground, 107 metres apart. A vertical post stands at C. From B the angle of elevation of the top of the post is 19 degrees. The height is 107 tan 19 degrees, which is 36.8 metres to 3 significant figures.</desc>
