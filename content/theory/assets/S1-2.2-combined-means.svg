<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-labelledby="s122a-t s122a-d">
<title id="s122a-t">Combined mean of two groups of different sizes</title>
<desc id="s122a-d">A block of 15 recordings with mean 12 and a block of 10 recordings with mean 18. The combined mean 14.4 is closer to 12 than to 18, and is not halfway at 15.</desc>
<line x1="40" y1="150" x2="390" y2="150" stroke="#333" stroke-width="1.2"/>
<polygon points="390,150 378,145 378,155" fill="#333"/>
<!-- scale: 0 at x=40, 25 at x=380, unit=13.6 -->
<line x1="203.2" y1="150" x2="203.2" y2="158" stroke="#333" stroke-width="1"/>
<text x="203.2" y="174" text-anchor="middle" font-family="serif" font-size="12" fill="#111">12</text>
<line x1="235.8" y1="150" x2="235.8" y2="158" stroke="#333" stroke-width="1"/>
<text x="235.8" y="174" text-anchor="middle" font-family="serif" font-size="12" fill="#111">14.4</text>
<line x1="244.0" y1="150" x2="244.0" y2="158" stroke="#333" stroke-width="1"/>
<text x="244.0" y="174" text-anchor="middle" font-family="serif" font-size="12" fill="#111">15</text>
<line x1="284.8" y1="150" x2="284.8" y2="158" stroke="#333" stroke-width="1"/>
<text x="284.8" y="174" text-anchor="middle" font-family="serif" font-size="12" fill="#111">18</text>
<rect x="163.2" y="70" width="80" height="70" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="203.2" y="100" text-anchor="middle" font-family="serif" font-size="12" fill="#1d4ed8">15 values</text>
<text x="203.2" y="118" text-anchor="middle" font-family="serif" font-size="12" fill="#1d4ed8">mean 12</text>
<rect x="256.8" y="90" width="56" height="50" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="284.8" y="112" text-anchor="middle" font-family="serif" font-size="11" fill="#991b1b">10 values</text>
<text x="284.8" y="128" text-anchor="middle" font-family="serif" font-size="11" fill="#991b1b">mean 18</text>
<line x1="235.8" y1="40" x2="235.8" y2="150" stroke="#16a34a" stroke-width="2"/>
<circle cx="235.8" cy="150" r="5" fill="#16a34a"/>
<text x="235.8" y="32" text-anchor="middle" font-family="serif" font-size="13" fill="#15803d">combined mean 14.4</text>
<line x1="244.0" y1="44" x2="244.0" y2="150" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="272.0" y="56" text-anchor="start" font-family="serif" font-size="11" fill="#6b7280">not 15</text>
<text x="40" y="200" font-family="serif" font-size="12" fill="#333">The combined mean is pulled towards the larger group, not halfway between the two means.</text>
</svg>
