<svg viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ig193ch-t ig193ch-d" style="width:100%;max-width:360px;height:auto"><title id="ig193ch-t">A circle with centre O and a chord AB, with the perpendicular from O meeting AB at M</title><desc id="ig193ch-d">Circle, centre O. Chord AB, with OM perpendicular to AB at M, the midpoint of AB. A NOT TO SCALE label sits inside the picture, away from the edges.</desc><circle cx="180" cy="120" r="90" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><line x1="99.4" y1="160" x2="260.6" y2="160" stroke="#0b5cab" stroke-width="2"/><line x1="180" y1="120" x2="180" y2="160" stroke="#c0392b" stroke-width="1.6"/><circle cx="180" cy="120" r="3" fill="#1a1a1a"/><circle cx="180" cy="160" r="3" fill="#1a1a1a"/><text x="188" y="114" font-size="13" font-family="sans-serif">O</text><text x="188" y="176" font-size="13" font-family="sans-serif">M</text><text x="83.37742251701451" y="152" font-size="13" font-family="sans-serif">A</text><text x="266.6225774829855" y="152" font-size="13" font-family="sans-serif">B</text><path d="M 172,160 L 172,152 L 180,152" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="250" y="36" font-size="11" font-family="sans-serif">NOT TO SCALE</text></svg>