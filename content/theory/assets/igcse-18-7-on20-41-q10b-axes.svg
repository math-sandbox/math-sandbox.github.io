<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:640px;height:auto" role="img" aria-labelledby="on20-41-q10b-t on20-41-q10b-d"><title id="on20-41-q10b-t">Blank axes from 0 degrees to 360 degrees for a sketch of y equals tan x</title><desc id="on20-41-q10b-d">A pair of axes with the origin labelled 0 at mid-height. The y-axis extends above and below the origin. Dotted vertical lines at 90, 180, 270 and 360 degrees run both above and below the x-axis. No graph is drawn.</desc><line x1="56" y1="300" x2="56" y2="24" stroke="#111827" stroke-width="1.8"/><polygon points="56,16 50,28 62,28" fill="#111827"/><line x1="56" y1="160" x2="600" y2="160" stroke="#111827" stroke-width="1.8"/><polygon points="610,160 598,154 598,166" fill="#111827"/><line x1="192.00" y1="40" x2="192.00" y2="280" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/><text x="192.00" y="182" text-anchor="middle" font-size="16" font-family="Times,serif">90°</text><line x1="328.00" y1="40" x2="328.00" y2="280" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/><text x="328.00" y="182" text-anchor="middle" font-size="16" font-family="Times,serif">180°</text><line x1="464.00" y1="40" x2="464.00" y2="280" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/><text x="464.00" y="182" text-anchor="middle" font-size="16" font-family="Times,serif">270°</text><line x1="600.00" y1="40" x2="600.00" y2="280" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/><text x="600.00" y="182" text-anchor="middle" font-size="16" font-family="Times,serif">360°</text><text x="42" y="166" text-anchor="end" font-size="16" font-family="Times,serif">0</text><text x="616" y="152" font-size="16" font-family="Times,serif" font-style="italic">x</text><text x="66" y="22" font-size="16" font-family="Times,serif" font-style="italic">y</text></svg>
