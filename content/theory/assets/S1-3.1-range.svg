<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:400px;height:auto" role="img" aria-label="A number line with the smallest and largest values of a data set marked">
  <style>text{font-family:system-ui,Segoe UI,sans-serif;font-size:13px;fill:#222}</style>
  <line x1="40" y1="80" x2="360" y2="80" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="80" r="5" fill="#1d4f91"/>
  <circle cx="320" cy="80" r="5" fill="#1d4f91"/>
  <circle cx="140" cy="80" r="4" fill="#888"/>
  <circle cx="200" cy="80" r="4" fill="#888"/>
  <circle cx="250" cy="80" r="4" fill="#888"/>
  <text x="60" y="110">smallest</text>
  <text x="280" y="110">largest</text>
  <text x="130" y="40">range of a data set = largest - smallest</text>
</svg>
