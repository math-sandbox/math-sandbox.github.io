<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:420px;height:auto" role="img" aria-labelledby="s221-t s221-d">
<title id="s221-t">Bar chart of the Poisson distribution with mean 2.4</title>
<desc id="s221-d">A bar chart of P of X equals k for k from 0 to 8, for a Poisson distribution with mean 2.4. The probabilities rise to a peak at 2 and then decrease.</desc>
<line x1="42" y1="240" x2="390" y2="240" stroke="#333" stroke-width="1.2"/>
<line x1="50" y1="24" x2="50" y2="248" stroke="#333" stroke-width="1.2"/>
<polygon points="390,240 378,235 378,245" fill="#333"/>
<polygon points="50,24 45,36 55,36" fill="#333"/>
<rect x="50.0" y="170.6" width="28" height="69.4" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="64.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">0</text>
<rect x="86.0" y="73.3" width="28" height="166.7" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="100.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">1</text>
<rect x="122.0" y="40.0" width="28" height="200.0" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="136.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">2</text>
<rect x="158.0" y="80.0" width="28" height="160.0" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="172.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">3</text>
<rect x="194.0" y="144.0" width="28" height="96.0" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="208.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">4</text>
<rect x="230.0" y="193.9" width="28" height="46.1" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="244.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">5</text>
<rect x="266.0" y="221.6" width="28" height="18.4" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="280.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">6</text>
<rect x="302.0" y="233.7" width="28" height="6.3" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="316.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">7</text>
<rect x="338.0" y="238.1" width="28" height="1.9" fill="#aed6f1" stroke="#1a5276" stroke-width="1.2"/>
<text x="352.0" y="258" text-anchor="middle" font-family="serif" font-size="12" fill="#111">8</text>
<text x="380" y="272" font-family="serif" font-size="14" fill="#111">k</text>
<text x="50" y="18" text-anchor="middle" font-family="serif" font-size="14" fill="#111">P(X = k)</text>
<text x="230" y="288" text-anchor="middle" font-family="serif" font-size="14" fill="#111">X ~ Po(2.4)</text>
</svg>
