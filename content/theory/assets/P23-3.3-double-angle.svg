<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="auto" preserveAspectRatio="xMinYMin meet" style="max-width:400px;height:auto" role="img" aria-label="A labelled reminder of the double-angle formulae for sine and cosine">
  <style>text{font-family:system-ui,Segoe UI,sans-serif;font-size:13px;fill:#222}</style>
  <text x="40" y="70">sin 2A = 2 sin A cos A</text>
  <text x="40" y="110">cos 2A = cos² A − sin² A</text>
  <text x="40" y="150">tan 2A = 2 tan A / (1 − tan² A)</text>
</svg>
