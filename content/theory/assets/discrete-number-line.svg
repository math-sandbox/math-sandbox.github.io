<svg preserveAspectRatio="xMidYMid meet" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" style="max-width:100%;height:auto" role="img" aria-labelledby="disc-nl-t disc-nl-d"><title id="disc-nl-t">Discrete values on a number line</title><desc id="disc-nl-d">A number line with filled dots only at the isolated values 0, 1, 2, 3 and 4, showing that discrete data can take only certain values.</desc><line x1="20" y1="40" x2="320" y2="40" stroke="#333" stroke-width="1.4"/><polygon points="320,40 310,35 310,45" fill="#333"/><circle cx="40" cy="40" r="5" fill="#1a5276" stroke="#1a5276"/><text x="40" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">0</text><circle cx="100" cy="40" r="5" fill="#1a5276" stroke="#1a5276"/><text x="100" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">1</text><circle cx="160" cy="40" r="5" fill="#1a5276" stroke="#1a5276"/><text x="160" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">2</text><circle cx="220" cy="40" r="5" fill="#1a5276" stroke="#1a5276"/><text x="220" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">3</text><circle cx="280" cy="40" r="5" fill="#1a5276" stroke="#1a5276"/><text x="280" y="62" text-anchor="middle" font-family="serif" font-size="14" fill="#111">4</text></svg>
